<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KarvIQ</title>
<style>
  :root{--ink:#0F0F0E;--amber:#D97B12;--muted:#6C6C64;--border:#E7E4DB;--bg:#EDEBE3;}
  *{box-sizing:border-box;margin:0;font-family:"Space Grotesk",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);padding:24px;}
  .card{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:36px 30px;
    box-shadow:0 24px 60px rgba(15,15,14,.14);text-align:center;}
  .logo{width:64px;height:64px;border-radius:18px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
    letter-spacing:-.5px;margin:0 auto 18px;}
  h1{font-size:22px;color:var(--ink);letter-spacing:-.3px;font-weight:600;}
  p{color:var(--muted);font-size:15px;line-height:1.5;margin-top:10px;}
  .btn{display:block;width:100%;height:52px;line-height:52px;border-radius:14px;background:var(--ink);
    color:#fff;font-weight:700;font-size:16px;text-decoration:none;margin-top:22px;border:none;cursor:pointer;}
  .err{color:#C0392B;}
  .warn{width:72px;height:72px;border-radius:50%;background:#FBE7E3;color:#C0392B;font-size:34px;
    line-height:72px;margin:0 auto 16px;}
  .foot{font-size:12px;color:#A5A59D;margin-top:18px;}
</style></head><body><div class="card">
<div class="logo" id="logo">K</div>
<div id="slot">
  <div class="warn">&#9888;</div>
  <h1 class="err">Link problem</h1>
  <p id="detail">This link is invalid or has expired.</p>
  <p>Go back to the app and request a new confirmation or password reset link.</p>
  <button class="btn" id="openBtn" onclick="openApp()">Open the app</button>
</div>
<div class="foot" id="foot">KarvIQ</div>
</div>
<script>
  const earlyQs = new URLSearchParams(location.search);
  const appKind = earlyQs.get('app') === 'business' ? 'business' : 'customer';
  const APP = appKind === 'business' ? "karviqbusiness://" : "karviq://";
  const PLAY_STORE = appKind === 'business'
    ? "https://play.google.com/store/apps/details?id=com.progranza.karviqbusiness"
    : "https://play.google.com/store/apps/details?id=com.progranza.karviq";
  const APP_STORE = appKind === 'business'
    ? "https://apps.apple.com/app/idAPPLE_APP_ID_BUSINESS"
    : "https://apps.apple.com/app/idAPPLE_APP_ID_CUSTOMER";
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const STORE_URL = isIOS ? APP_STORE : PLAY_STORE;

  const APP_NAME = appKind === 'business' ? 'KarvIQ Business' : 'KarvIQ';
  document.getElementById('foot').textContent = APP_NAME;
  document.getElementById('logo').textContent = appKind === 'business' ? 'KB' : 'K';
  document.getElementById('openBtn').textContent = 'Open ' + APP_NAME;
  document.title = APP_NAME;

  const hash = new URLSearchParams(location.hash.slice(1));
  const qs = new URLSearchParams(location.search);
  const err = hash.get('error_description') || qs.get('error_description') || hash.get('error') || qs.get('error');
  if (err) {
    document.getElementById('detail').textContent = decodeURIComponent(err);
  }

  function openApp(){
    const timer = setTimeout(function(){
      if (document.visibilityState === 'visible') {
        location.href = STORE_URL;
      }
    }, 1600);
    document.addEventListener('visibilitychange', function onVis(){
      if (document.visibilityState === 'hidden') {
        clearTimeout(timer);
        document.removeEventListener('visibilitychange', onVis);
      }
    });
    location.href = APP;
  }
</script>
</body></html>
