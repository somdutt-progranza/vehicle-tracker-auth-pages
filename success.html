<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KarvIQ</title>
<style>
  :root{--ink:#0F0F0E;--amber:#D97B12;--muted:#6C6C64;--border:#E7E4DB;--bg:#EDEBE3;}
  *{box-sizing:border-box;margin:0;font-family:"Space Grotesk",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);padding:24px;}
  .card{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:36px 30px;
    box-shadow:0 24px 60px rgba(15,15,14,.14);text-align:center;}
  .logo{width:64px;height:64px;border-radius:18px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
    letter-spacing:-.5px;margin:0 auto 18px;}
  h1{font-size:22px;color:var(--ink);letter-spacing:-.3px;font-weight:600;}
  p{color:var(--muted);font-size:15px;line-height:1.5;margin-top:10px;}
  .btn{display:block;width:100%;height:52px;line-height:52px;border-radius:14px;background:var(--ink);
    color:#fff;font-weight:700;font-size:16px;text-decoration:none;margin-top:22px;border:none;cursor:pointer;}
  .btn.amber{background:var(--amber);color:#fff;}
  input{width:100%;height:50px;border:1px solid var(--border);border-radius:12px;padding:0 14px;
    font-size:16px;margin-top:14px;color:var(--ink);}
  label{display:block;text-align:left;font-size:13px;font-weight:600;color:var(--muted);margin-top:14px;}
  .ok{color:#1B7A4A;} .err{color:#C0392B;}
  .tick{width:72px;height:72px;border-radius:50%;background:#E4F0E8;color:#1B7A4A;font-size:38px;
    line-height:72px;margin:0 auto 16px;}
  .foot{font-size:12px;color:#A5A59D;margin-top:18px;}
</style></head><body><div class="card">
<div class="logo" id="logo">K</div>
<div id="slot"><h1>Loading&hellip;</h1></div>
<div class="foot" id="foot">KarvIQ</div>
</div>
<script>
  const SUPABASE_URL = "https://nyklbvlregofpplcojbf.supabase.co";
  const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55a2xidmxyZWdvZnBwbGNvamJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Mjk2MjMsImV4cCI6MjEwMTQwNTYyM30.eeSPv6Wph-FEg8v0zPnuV40vXjYMfT5QwciaBOcQYR8";

  // karviq-customer and karviq-business are separate apps sharing this one
  // Supabase project, each with its own scheme/package id. Each app passes
  // ?app=customer or ?app=business in its emailRedirectTo/resetTo URL so this
  // page knows which one to hand off to; default to customer if missing
  // (e.g. an old email sent before this param existed).
  const earlyQs = new URLSearchParams(location.search);
  const appKind = earlyQs.get('app') === 'business' ? 'business' : 'customer';
  const APP = appKind === 'business' ? "karviqbusiness://" : "karviq://";
  // Bundle/package id matches app.config.js exactly on both platforms. Both
  // URLs 404 until each app is actually published on its store — the Apple
  // ones use placeholder numeric ids since there's no App Store listing yet;
  // replace APPLE_APP_ID_* once one exists. Both start working automatically
  // with no code change once published.
  const PLAY_STORE = appKind === 'business'
    ? "https://play.google.com/store/apps/details?id=com.progranza.karviqbusiness"
    : "https://play.google.com/store/apps/details?id=com.progranza.karviq";
  const APP_STORE = appKind === 'business'
    ? "https://apps.apple.com/app/idAPPLE_APP_ID_BUSINESS"
    : "https://apps.apple.com/app/idAPPLE_APP_ID_CUSTOMER";
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const STORE_URL = isIOS ? APP_STORE : PLAY_STORE;

  const APP_NAME = appKind === 'business' ? 'KarvIQ Business' : 'KarvIQ';
  document.getElementById('foot').textContent = APP_NAME;
  document.getElementById('logo').textContent = appKind === 'business' ? 'KB' : 'K';
  document.title = APP_NAME;

  const hash = new URLSearchParams(location.hash.slice(1));
  const qs = new URLSearchParams(location.search);
  const type = hash.get('type') || qs.get('type');
  const at = hash.get('access_token');

  function show(html){ document.getElementById('slot').innerHTML = html; }
  // No reliable "is the app installed" API exists in a browser — the
  // standard technique is: attempt the deep link, then check after a short
  // delay whether this tab is still visible. If the OS had an app to hand
  // off to, the tab backgrounds/closes before the timer fires; if we're
  // still here, there was nothing to open it with, so send the user to the
  // Play Store instead of leaving the button looking dead.
  function openApp(){
    const timer = setTimeout(function(){
      if (document.visibilityState === 'visible') {
        location.href = STORE_URL;
      }
    }, 1600);
    document.addEventListener('visibilitychange', function onVis(){
      if (document.visibilityState === 'hidden') {
        clearTimeout(timer);
        document.removeEventListener('visibilitychange', onVis);
      }
    });
    location.href = APP;
  }

  if (type === 'recovery' && at) {
    show('<h1>Set a new password</h1><p>Choose a new password for your account.</p>'+
      '<label>New password</label><input id="pw" type="password" placeholder="At least 6 characters"/>'+
      '<button class="btn" id="save">Update password</button><p id="msg"></p>');
    document.getElementById('save').onclick = async () => {
      const pw = document.getElementById('pw').value;
      const msg = document.getElementById('msg');
      if (!pw || pw.length < 6){ msg.className='err'; msg.textContent='Password must be at least 6 characters.'; return; }
      msg.textContent='Saving...';
      const r = await fetch(SUPABASE_URL+'/auth/v1/user', {method:'PUT',
        headers:{'Authorization':'Bearer '+at,'apikey':ANON,'Content-Type':'application/json'},
        body: JSON.stringify({password: pw})});
      if (r.ok){ show('<div class="tick">&check;</div><h1>Password updated</h1><p>You can now open '+APP_NAME+' and log in with your new password.</p><button class="btn amber" onclick="openApp()">Open '+APP_NAME+'</button>'); }
      else {
        const e = await r.json().catch(()=>({}));
        msg.className='err'; msg.textContent = e.msg || e.error_description || 'Could not update password.';
      }
    };
  } else {
    show('<div class="tick">&check;</div><h1>Email confirmed</h1><p>Your account is verified. Open '+APP_NAME+' and log in to get started.</p><button class="btn amber" onclick="openApp()">Open '+APP_NAME+'</button>');
  }
</script>
</body></html>
